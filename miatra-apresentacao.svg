<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Miatra — ambiente de inspeção e revisão para Android</title>
  <desc id="desc">Apresentação do Miatra Preview 0.1.0, com frentes de revisão, ferramentas de inspeção, privacidade e etapas de desenvolvimento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf2eb"/>
      <stop offset="1" stop-color="#eee8f4"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211b35"/>
      <stop offset="1" stop-color="#34284f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a65dc"/>
      <stop offset="1" stop-color="#5b8de8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8d7b9d" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#332747" flood-opacity=".10"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .ink{fill:#282336}.muted{fill:#766d7e}.white{fill:#fffaf7}
      .eyebrow{font-size:13px;font-weight:750;letter-spacing:2.5px}
      .cardtitle{font-size:19px;font-weight:750;fill:#2b2538}
      .body{font-size:14px;fill:#716879}
      .tiny{font-size:11px;letter-spacing:1px;font-weight:700}
      .line{stroke:#d8cfdb;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <rect width="1600" height="1120" fill="url(#grid)"/>
  <circle cx="1450" cy="95" r="220" fill="#bba4ef" opacity=".12"/>
  <circle cx="80" cy="1030" r="260" fill="#9bd8c7" opacity=".13"/>

  <!-- Header -->
  <g class="sans">
    <rect x="76" y="58" width="52" height="52" rx="17" fill="#2a223d"/>
    <path d="M91 91V76l10-7 11 7v15M91 83h21" fill="none" stroke="#c9b7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="146" y="80" class="ink" font-size="25" font-weight="800" letter-spacing="-.8">MIATRA</text>
    <text x="147" y="101" class="muted" font-size="11" font-weight="700" letter-spacing="2.1">ANDROID INSPECTION WORKSPACE</text>
    <rect x="1304" y="65" width="220" height="38" rx="19" fill="#fffaf7" stroke="#d9cfdf"/>
    <circle cx="1327" cy="84" r="5" fill="#8a65dc"/>
    <text x="1342" y="89" class="muted" font-size="12" font-weight="750" letter-spacing="1.1">PREVIEW 0.1.0 · ARM64</text>
  </g>

  <!-- Hero -->
  <g filter="url(#shadow)">
    <rect x="76" y="145" width="1448" height="320" rx="30" fill="url(#hero)"/>
    <rect x="76" y="145" width="1448" height="320" rx="30" fill="url(#grid)" opacity=".42"/>
  </g>
  <g class="sans">
    <text x="122" y="205" fill="#bca8f4" class="eyebrow">INSPECIONAR · ENTENDER · REVISAR</text>
    <text x="120" y="278" fill="#fffaf7" font-size="66" font-weight="820" letter-spacing="-2.5">Mais clareza</text>
    <text x="120" y="346" fill="#fffaf7" font-size="66" font-weight="820" letter-spacing="-2.5">sobre o que acontece.</text>
    <text x="124" y="393" fill="#d6cfe0" font-size="18">Um espaço Android para explorar páginas, observar comportamento</text>
    <text x="124" y="420" fill="#d6cfe0" font-size="18">e reunir ferramentas de inspeção em um só fluxo.</text>

    <!-- abstract inspection panel -->
    <rect x="1030" y="184" width="435" height="232" rx="19" fill="#171426" stroke="#66577d" stroke-width="1.2"/>
    <rect x="1030" y="184" width="435" height="40" rx="19" fill="#28223a"/>
    <path d="M1030 205v19h435v-19" fill="#28223a"/>
    <circle cx="1055" cy="204" r="5" fill="#e58c9a"/>
    <circle cx="1073" cy="204" r="5" fill="#e7c17b"/>
    <circle cx="1091" cy="204" r="5" fill="#8fd3b7"/>
    <text x="1120" y="209" class="mono" font-size="11" fill="#b9afc9">MIATRA / REVIEW SESSION</text>
    <text x="1060" y="260" class="mono" font-size="12" fill="#9e8cbd">01</text>
    <text x="1094" y="260" class="mono" font-size="13" fill="#f6f0fa">WorldView</text>
    <rect x="1324" y="246" width="104" height="20" rx="10" fill="#314b48"/>
    <text x="1376" y="260" text-anchor="middle" class="mono" font-size="10" fill="#a9e1c9">REVISÃO</text>
    <text x="1060" y="300" class="mono" font-size="12" fill="#9e8cbd">02</text>
    <text x="1094" y="300" class="mono" font-size="13" fill="#f6f0fa">DevSurf</text>
    <rect x="1324" y="286" width="104" height="20" rx="10" fill="#314b48"/>
    <text x="1376" y="300" text-anchor="middle" class="mono" font-size="10" fill="#a9e1c9">REVISÃO</text>
    <text x="1060" y="340" class="mono" font-size="12" fill="#9e8cbd">03</text>
    <text x="1094" y="340" class="mono" font-size="13" fill="#f6f0fa">Tor / ADB</text>
    <rect x="1324" y="326" width="104" height="20" rx="10" fill="#4c3d63"/>
    <text x="1376" y="340" text-anchor="middle" class="mono" font-size="10" fill="#d7c6ff">VALIDAÇÃO</text>
    <path d="M1060 370h365" stroke="#4b405d"/>
    <text x="1060" y="395" class="mono" font-size="10" fill="#a69bb5">ETAPAS ORGANIZADAS · STATUS EM ACOMPANHAMENTO</text>
  </g>

  <!-- Feature cards -->
  <g filter="url(#shadow)">
    <rect x="76" y="500" width="348" height="210" rx="22" fill="#fffaf7"/>
    <rect x="444" y="500" width="348" height="210" rx="22" fill="#fffaf7"/>
    <rect x="812" y="500" width="348" height="210" rx="22" fill="#fffaf7"/>
    <rect x="1180" y="500" width="344" height="210" rx="22" fill="#fffaf7"/>
  </g>
  <g class="sans">
    <!-- WorldView -->
    <rect x="104" y="529" width="48" height="48" rx="15" fill="#eee7fb"/>
    <circle cx="128" cy="553" r="12" fill="none" stroke="#7959c8" stroke-width="2"/>
    <path d="M116 553h24M128 541c5 6 5 18 0 24M128 541c-5 6-5 18 0 24" fill="none" stroke="#7959c8" stroke-width="1.5"/>
    <text x="104" y="615" class="cardtitle">WorldView</text>
    <text x="104" y="644" class="body">Navegação e contexto de página</text>
    <text x="104" y="666" class="body">para apoiar a inspeção.</text>
    <text x="104" y="690" fill="#8063c9" class="tiny">AMBIENTE DE NAVEGAÇÃO</text>

    <!-- DevSurf -->
    <rect x="472" y="529" width="48" height="48" rx="15" fill="#e5f4ef"/>
    <path d="M483 545h26M483 553h18M483 561h22" stroke="#398b73" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="505" cy="561" r="3" fill="#398b73"/>
    <text x="472" y="615" class="cardtitle">DevSurf</text>
    <text x="472" y="644" class="body">Observação de console, rede</text>
    <text x="472" y="666" class="body">e recursos, com coleta limitada.</text>
    <text x="472" y="690" fill="#398b73" class="tiny">FERRAMENTAS DE INSPEÇÃO</text>

    <!-- Tor / ADB -->
    <rect x="840" y="529" width="48" height="48" rx="15" fill="#f8eddf"/>
    <path d="M864 540l11 5v8c0 8-5 13-11 16-6-3-11-8-11-16v-8z" fill="none" stroke="#b77a35" stroke-width="2"/>
    <path d="M859 554l4 4 7-8" fill="none" stroke="#b77a35" stroke-width="2" stroke-linecap="round"/>
    <text x="840" y="615" class="cardtitle">Tor &amp; ADB</text>
    <text x="840" y="644" class="body">Frentes de integração e validação</text>
    <text x="840" y="666" class="body">de conectividade e autorização.</text>
    <text x="840" y="690" fill="#b77a35" class="tiny">INTEGRAÇÕES EM REVISÃO</text>

    <!-- Mirtis -->
    <rect x="1208" y="529" width="48" height="48" rx="15" fill="#f9e8ee"/>
    <path d="M1232 540v25M1220 552h24M1223 543l18 18M1241 543l-18 18" stroke="#b45d7b" stroke-width="1.8" stroke-linecap="round"/>
    <text x="1208" y="615" class="cardtitle">Mirtis Gemini</text>
    <text x="1208" y="644" class="body">Recursos assistidos com envio</text>
    <text x="1208" y="666" class="body">somente após consentimento.</text>
    <text x="1208" y="690" fill="#b45d7b" class="tiny">CONTROLE DO USUÁRIO</text>
  </g>

  <!-- Review stages -->
  <g class="sans">
    <text x="80" y="770" class="eyebrow" fill="#8063c9">POR DENTRO DO PROCESSO</text>
    <text x="80" y="808" class="ink" font-size="29" font-weight="800" letter-spacing="-.7">Etapas de revisão e preparação</text>
    <text x="80" y="835" class="muted" font-size="14">Um roteiro técnico em evolução — cada frente é verificada antes de ser tratada como concluída.</text>

    <path d="M112 895H1480" stroke="#cfc4d6" stroke-width="3" stroke-linecap="round"/>
    <g>
      <circle cx="112" cy="895" r="10" fill="#8063c9" stroke="#fffaf7" stroke-width="4"/>
      <circle cx="386" cy="895" r="10" fill="#8063c9" stroke="#fffaf7" stroke-width="4"/>
      <circle cx="660" cy="895" r="10" fill="#5a91d8" stroke="#fffaf7" stroke-width="4"/>
      <circle cx="934" cy="895" r="10" fill="#5a91d8" stroke="#fffaf7" stroke-width="4"/>
      <circle cx="1208" cy="895" r="10" fill="#41977c" stroke="#fffaf7" stroke-width="4"/>
      <circle cx="1480" cy="895" r="10" fill="#41977c" stroke="#fffaf7" stroke-width="4"/>
    </g>
    <g fill="#2b2538">
      <text x="82" y="930" font-size="15" font-weight="750">01 · Requisitos</text>
      <text x="82" y="953" class="body">Leitura e avaliação</text>
      <text x="82" y="973" class="body">das necessidades</text>

      <text x="356" y="930" font-size="15" font-weight="750">02 · Arquitetura</text>
      <text x="356" y="953" class="body">WorldView, DevSurf</text>
      <text x="356" y="973" class="body">e estrutura do app</text>

      <text x="630" y="930" font-size="15" font-weight="750">03 · Integrações</text>
      <text x="630" y="953" class="body">Tor, ADB e dependências</text>
      <text x="630" y="973" class="body">sob verificação</text>

      <text x="904" y="930" font-size="15" font-weight="750">04 · Ambiente</text>
      <text x="904" y="953" class="body">SDK, ferramentas</text>
      <text x="904" y="973" class="body">e compilação nativa</text>

      <text x="1178" y="930" font-size="15" font-weight="750">05 · Validação</text>
      <text x="1178" y="953" class="body">Sintaxe, estrutura</text>
      <text x="1178" y="973" class="body">e revisão de alterações</text>
    </g>
  </g>

  <!-- Privacy note + footer -->
  <g class="sans">
    <rect x="76" y="1010" width="1448" height="62" rx="17" fill="#e8e1ed" stroke="#d6cbdc"/>
    <path d="M104 1032l9-4 9 4v7c0 7-4 11-9 14-5-3-9-7-9-14z" fill="none" stroke="#7259aa" stroke-width="1.8"/>
    <path d="M109 1040l3 3 5-6" fill="none" stroke="#7259aa" stroke-width="1.8" stroke-linecap="round"/>
    <text x="140" y="1038" fill="#393146" font-size="13" font-weight="800">PRIVACIDADE COM LIMITES EXPLÍCITOS</text>
    <text x="140" y="1057" fill="#766d7e" font-size="12">Sessão privativa local; Tor restrito ao tráfego do Miatra. Preview ainda requer validações reais — não é o Tor Browser nem uma VPN global.</text>
    <text x="1495" y="1097" text-anchor="end" fill="#897f91" font-size="10" letter-spacing="1.4">MIATRA · PROJETO EM DESENVOLVIMENTO</text>
  </g>
</svg>
